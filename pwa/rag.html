<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GS420 AI Documents</title><style>body{font-family:system-ui;max-width:900px;margin:24px auto;padding:0 16px;background:#f8fafc}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}button,input{padding:10px;border-radius:8px;border:1px solid #bbb}pre{white-space:pre-wrap}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><h1>GS420 AI Documents</h1><div class="card"><div class="row"><input id="file" type="file" accept=".pdf,.docx,.txt,.md,.csv,.json"><label><input id="embed" type="checkbox"> Create embeddings</label><button onclick="upload()">Upload</button></div><p id="msg"></p></div><div class="card"><h2>Search</h2><div class="row"><input id="q" placeholder="Search documents" style="flex:1"><label><input id="semantic" type="checkbox" checked> Semantic</label><button onclick="search()">Search</button></div><pre id="results"></pre></div><div class="card"><h2>Documents</h2><pre id="docs"></pre></div><script>async function upload(){let f=file.files[0];if(!f)return;let x=new FormData();x.append("file",f);x.append("embed",embed.checked);let r=await fetch("/api/rag/documents",{method:"POST",body:x});msg.textContent=r.ok?"Uploaded":"Error: "+(await r.text());load()}async function search(){let r=await fetch("/api/rag/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q.value,limit:10,semantic:semantic.checked})});results.textContent=JSON.stringify(await r.json(),null,2)}async function load(){let r=await fetch("/api/rag/stats");docs.textContent=JSON.stringify(await r.json(),null,2)}load()</script></body></html>
