<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GS420 AI Monitor</title>
<style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:24px auto;padding:0 16px;background:#f8fafc} .card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0} input,button{padding:10px;border:1px solid #bbb;border-radius:8px} pre{white-space:pre-wrap;overflow:auto}</style></head>
<body><h1>GS420 AI Monitor</h1><div class="card"><input id="token" type="password" placeholder="GS420_ADMIN_TOKEN" style="width:min(100%,420px)"><button onclick="load()">Refresh</button></div><div id="summary" class="card">Enter admin token.</div><div id="events" class="card"></div>
<script>
const token=document.getElementById("token"); token.value=sessionStorage.getItem("gs420_admin_token")||"";
async function load(){const t=token.value.trim(); if(!t)return; sessionStorage.setItem("gs420_admin_token",t);
try{const r=await fetch("/api/metrics/summary",{headers:{"X-GS420-Admin-Token":t}});const d=await r.json();if(!r.ok)throw Error(d.detail||"Request failed");
summary.innerHTML="<b>Uptime:</b> "+d.uptime_seconds+"s &nbsp; <b>Requests:</b> "+d.requests_total+" &nbsp; <b>5xx:</b> "+d.errors_5xx+" &nbsp; <b>Avg:</b> "+d.average_latency_ms+" ms";
events.innerHTML="<h2>Recent requests</h2><pre>"+JSON.stringify(d.recent_events,null,2)+"</pre>";
}catch(e){summary.textContent="Error: "+e.message}}
setInterval(load,10000);
</script></body></html>
